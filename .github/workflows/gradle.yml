name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Run repository-wide tests
        if: runner.os == 'Linux'
        working-directory:  ${{ github.workspace }}/.github
        run: ./run-checks.sh

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          # Use the JavaFX version declared in Gradle, not a second copy bundled with the JDK.
          java-package: jdk

      - name: Install virtual display for JavaFX tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb xauth

      - name: Build and check with Gradle using a virtual display
        if: runner.os == 'Linux'
        run: xvfb-run -a ./gradlew check coverage

      - name: Build and check with Gradle
        if: runner.os != 'Linux'
        run: ./gradlew check coverage

      - name: Upload test and crash diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ matrix.platform }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/reports/tests/
            build/test-results/
            **/hs_err_pid*.log
            **/replay_pid*.log

      - name: Upload coverage reports to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
